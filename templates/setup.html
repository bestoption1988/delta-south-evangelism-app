<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>MCN Delta South — Initial Setup</title><link rel="stylesheet" href="/static/app.css"></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><div class="brand auth-brand">✦</div><div class="eyebrow">FIRST-TIME SETUP</div><h1>Delta South Diocese</h1><h2>Create Administrator</h2><p class="auth-subtitle">Create the first account for the Evangelism Mission System.</p>{% if error %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="post"><label>Administrator username<input name="username" type="text" autocomplete="username" minlength="3" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirm password<input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary auth-button" type="submit">Create Administrator</button></form><p class="auth-note">Use at least 8 characters for the password.</p></section></main></body></html>
