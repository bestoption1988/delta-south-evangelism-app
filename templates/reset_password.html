<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>MCN Delta South — Reset Password</title>
<link rel="stylesheet" href="/static/app.css">
</head>

<body class="auth-page">
<main class="auth-shell">
<section class="auth-card">

<div class="brand auth-brand">✦</div>
<div class="eyebrow">METHODIST CHURCH NIGERIA</div>
<h1>Delta South Diocese</h1>
<h2>Department of Evangelism</h2>
<p class="auth-subtitle">Create a New Password</p>

{% if error %}
<div class="auth-error">{{ error }}</div>
{% endif %}

{% if token %}
<form method="post" autocomplete="off">

<label>
New Password
<input
name="password"
type="password"
autocomplete="new-password"
required
minlength="8"
placeholder="Enter new password">
</label>

<label>
Confirm New Password
<input
name="confirm"
type="password"
autocomplete="new-password"
required
minlength="8"
placeholder="Confirm new password">
</label>

<button class="primary auth-button" type="submit">
Reset Password
</button>

</form>
{% else %}
<p class="auth-note">
Please request a new password reset link.
</p>
{% endif %}

<p class="auth-note">
<a href="{{ url_for('forgot_password') }}">Request another reset link</a>
</p>

<p class="auth-note">
<a href="{{ url_for('login') }}">← Back to Login</a>
</p>

</section>
</main>
</body>
</html>
