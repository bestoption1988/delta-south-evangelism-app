<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holy Bible | MCN Delta South Diocese</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#172b4d;font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:linear-gradient(125deg,#071b48,#153c78 65%,#0d684c);color:#fff;padding:26px 16px}
.wrap{max-width:1000px;margin:auto}header a{color:#f4d36e;text-decoration:none;font-weight:700}h1{font:800 clamp(28px,5vw,42px)/1.1 Georgia,serif;margin:12px 0 5px}
main{max-width:1000px;margin:22px auto;padding:0 14px 45px}.controls,.reader{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:17px;box-shadow:0 5px 18px #102b5509}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
label{display:block;font-size:12px;font-weight:800;color:#52627b;margin-bottom:5px}
select,button{width:100%;min-height:44px;border:1px solid #cbd5e1;border-radius:9px;padding:9px 11px;font:inherit;background:#fff;color:#172b4d}
button{background:#123767;color:#fff;border:0;font-weight:800;cursor:pointer}.nav{display:flex;gap:10px;margin-top:12px}.nav button{flex:1}
.reader{margin-top:16px;min-height:300px}.reader h2{font:700 27px Georgia,serif;margin:0 0 5px}.note{color:#6b778b;font-size:12px}.verse{font:18px/1.85 Georgia,serif;padding:9px 0;border-bottom:1px solid #edf0f4}.verse b{font:700 12px system-ui;color:#a77b13;margin-right:8px}
.status{padding:20px;text-align:center;color:#64748b}.error{color:#a11b1b}
@media(max-width:600px){.controls{grid-template-columns:1fr 1fr}.controls .go{grid-column:1/-1}.verse{font-size:17px}}
</style></head><body>
<header><div class="wrap"><a href="/devotional-centre">← Devotional & Worship Centre</a><h1>📖 Holy Bible</h1><div>World English Bible (WEB) · Public domain · 66 books</div></div></header>
<main><section class="controls">
<div><label for="book">BOOK</label><select id="book"></select></div>
<div><label for="chapter">CHAPTER</label><select id="chapter"></select></div>
<div class="go"><button id="load">Read Chapter</button></div>
</section>
<div class="nav"><button id="prev" type="button">← Previous</button><button id="next" type="button">Next →</button></div>
<section class="reader" id="reader"><div class="status">Choose a book and chapter to begin reading.</div></section>
<p class="note">Scripture text: World English Bible (WEB), public domain. The Bible reader is displayed within the MCN Delta South Diocese website.</p>
</main>
<script>
const books=[
["Genesis",50],["Exodus",40],["Leviticus",27],["Numbers",36],["Deuteronomy",34],["Joshua",24],["Judges",21],["Ruth",4],["1 Samuel",31],["2 Samuel",24],["1 Kings",22],["2 Kings",25],["1 Chronicles",29],["2 Chronicles",36],["Ezra",10],["Nehemiah",13],["Esther",10],["Job",42],["Psalms",150],["Proverbs",31],["Ecclesiastes",12],["Song of Solomon",8],["Isaiah",66],["Jeremiah",52],["Lamentations",5],["Ezekiel",48],["Daniel",12],["Hosea",14],["Joel",3],["Amos",9],["Obadiah",1],["Jonah",4],["Micah",7],["Nahum",3],["Habakkuk",3],["Zephaniah",3],["Haggai",2],["Zechariah",14],["Malachi",4],
["Matthew",28],["Mark",16],["Luke",24],["John",21],["Acts",28],["Romans",16],["1 Corinthians",16],["2 Corinthians",13],["Galatians",6],["Ephesians",6],["Philippians",4],["Colossians",4],["1 Thessalonians",5],["2 Thessalonians",3],["1 Timothy",6],["2 Timothy",4],["Titus",3],["Philemon",1],["Hebrews",13],["James",5],["1 Peter",5],["2 Peter",3],["1 John",5],["2 John",1],["3 John",1],["Jude",1],["Revelation",22]
];
const book=document.getElementById("book"),chapter=document.getElementById("chapter"),reader=document.getElementById("reader");
books.forEach(([name],i)=>{const o=document.createElement("option");o.value=i;o.textContent=name;book.appendChild(o)});
function fillChapters(){chapter.innerHTML="";for(let n=1;n<=books[+book.value][1];n++){const o=document.createElement("option");o.value=n;o.textContent="Chapter "+n;chapter.appendChild(o)}}
book.addEventListener("change",()=>{fillChapters();loadChapter()});chapter.addEventListener("change",loadChapter);
async function loadChapter(){
 const name=books[+book.value][0],ch=chapter.value;
 reader.innerHTML='<div class="status">Loading '+name+' '+ch+'…</div>';
 try{
  const url='https://bible-api.com/'+encodeURIComponent(name+' '+ch)+'?translation=web';
  const response=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!response.ok)throw new Error('Bible service returned '+response.status);
  const data=await response.json();
  if(!Array.isArray(data.verses)||!data.verses.length)throw new Error('No verses were returned for this chapter.');
  const title=document.createElement('h2');title.textContent=data.reference||name+' '+ch;reader.replaceChildren(title);
  data.verses.forEach(v=>{const p=document.createElement('p');p.className='verse';const n=document.createElement('b');n.textContent=v.verse;p.append(n,document.createTextNode(' '+v.text.trim()));reader.appendChild(p)});
  const note=document.createElement('div');note.className='note';note.textContent='World English Bible · Public Domain';reader.appendChild(note);
 }catch(e){reader.innerHTML='<div class="status error">Unable to load this chapter right now. Please check your internet connection and try again.<br>'+String(e.message||e)+'</div>'}
}
function move(delta){let b=+book.value,c=+chapter.value+delta;if(c<1){if(b===0)return;b--;c=books[b][1]}if(c>books[b][1]){if(b===books.length-1)return;b++;c=1}book.value=b;fillChapters();chapter.value=c;loadChapter()}
document.getElementById('load').addEventListener('click',loadChapter);
document.getElementById('prev').addEventListener('click',()=>move(-1));
document.getElementById('next').addEventListener('click',()=>move(1));
fillChapters();loadChapter();
</script></body></html>
