<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>MCN Delta South — Change Password</title><link rel="stylesheet" href="/static/app.css"></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><div class="brand auth-brand">✦</div><div class="eyebrow">ACCOUNT SECURITY</div><h1>Change Password</h1><p class="auth-subtitle">Update your password before continuing to the diocesan system.</p>{% if error %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="post"><label>Current password<input name="old_password" type="password" autocomplete="current-password" required></label><label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary auth-button" type="submit">Update Password</button></form><p class="auth-note"><a href="/logout">Sign out</a></p></section></main></body></html>
