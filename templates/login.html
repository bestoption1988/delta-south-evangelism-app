<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>MCN Delta South — Login</title><link rel="stylesheet" href="/static/app.css"></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><div class="brand auth-brand">✦</div><div class="eyebrow">METHODIST CHURCH NIGERIA</div><h1>Delta South Diocese</h1><h2>Department of Evangelism</h2><p class="auth-subtitle">Secure Mission Management System</p>{% if error %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="post" autocomplete="on"><label>Username<input name="username" type="text" autocomplete="username" required autofocus></label><label>Password<input id="login-password" name="password" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" onclick="toggleLoginPassword()" aria-controls="login-password" aria-pressed="false">Show password</button></label><button class="primary auth-button" type="submit">Sign in</button>
</form>
<p class="auth-note">
<a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
</p>
<p class="auth-note">
<a href="{{ url_for('public_member_registration_page') }}">Register as a Church Member</a>
</p>
<p class="auth-note"><a href="{{ url_for('public_home') }}">🏠 Home</a></p><p class="auth-note">Authorized diocesan users only.</p></section></main>
<script>
function toggleLoginPassword() {
    const input = document.getElementById("login-password");
    const button = document.querySelector(".password-toggle");
    const showing = input.type === "password";
    input.type = showing ? "text" : "password";
    button.textContent = showing ? "Hide password" : "Show password";
    button.setAttribute("aria-pressed", String(showing));
}
</script>
</body></html>
