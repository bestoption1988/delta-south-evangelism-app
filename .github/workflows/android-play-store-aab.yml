name: Android Release AAB and Installable APK

on:
  workflow_dispatch:
  push:
    branches:
      - postgres-migration-integration
    paths:
      - 'android/**'
      - 'app.py'
      - 'templates/**'
      - 'static/**'
      - '.github/workflows/android-play-store-aab.yml'

permissions:
  contents: read

jobs:
  build-release-aab:
    name: Build and verify signed AAB and APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: postgres-migration-integration

      - name: Package and verify the real diocesan homepage and its assets
        run: |
          set -euo pipefail
          BASE_URL="https://mcn-delta-south.naijacloud.app/"
          HOST="mcn-delta-south.naijacloud.app"
          DEST="android/app/src/main/assets/offline-home"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          # Fetch the actual public homepage plus its same-origin linked pages and
          # every page prerequisite (CSS, JS, images, fonts and media referenced by CSS).
          # Keep the host directory out so /static/... maps to assets/offline-home/static/...
          wget --verbose \
            --recursive --level=1 --no-parent --page-requisites \
            --convert-links --adjust-extension --no-host-directories \
            --domains="$HOST" --directory-prefix="$DEST" "$BASE_URL"
          test -s "$DEST/index.html"
          FILE_COUNT="$(find "$DEST" -type f | wc -l)"
          TOTAL_SIZE="$(du -sh "$DEST" | cut -f1)"
          echo "Offline homepage files packaged: $FILE_COUNT"
          echo "Offline homepage package size: $TOTAL_SIZE"
          test "$FILE_COUNT" -ge 5 || { echo "Homepage package is incomplete: fewer than five files were downloaded"; exit 1; }
          # Fail the release if the downloaded homepage still points at a same-origin
          # asset path that is absent from the APK package.
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          root = Path("android/app/src/main/assets/offline-home")
          html = (root / "index.html").read_text(encoding="utf-8", errors="replace")
          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  rel = attrs.get("rel", "").lower().split()
                  candidates = []
                  if tag in ("script", "img", "source", "video", "audio", "iframe", "embed", "track"):
                      candidates.append(attrs.get("src", ""))
                  if tag == "video":
                      candidates.append(attrs.get("poster", ""))
                  if tag == "link" and any(x in rel for x in ("stylesheet", "icon", "preload", "modulepreload")):
                      candidates.append(attrs.get("href", ""))
                  for value in candidates:
                      if value.startswith(("https://mcn-delta-south.naijacloud.app/", "/")):
                          parsed = urlparse(value)
                          path = unquote(parsed.path).lstrip("/")
                          if path and not path.endswith("/"):
                              self.urls.append(path)
          parser = Assets()
          parser.feed(html)
          missing = [p for p in parser.urls if not (root / p).is_file()]
          if missing:
              print("Same-origin homepage assets not found in APK package:")
              for path in sorted(set(missing)):
                  print(" -", path)
              raise SystemExit(1)
          print(f"Verified {len(parser.urls)} same-origin asset references from homepage HTML.")
          PY
          echo "Packaged homepage tree:"
          find "$DEST" -type f | sort | head -n 100
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/build-tools"
          echo "Android SDK is available on the GitHub runner."

      - name: Restore Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/release-key.jks
          test -s android/app/release-key.jks
          chmod 600 android/app/release-key.jks

      - name: Download Gradle 8.11.1 with retries and fallback
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gradle-dist"
          cd "$RUNNER_TEMP/gradle-dist"
          download_gradle() {
            local url="$1"
            for attempt in 1 2 3 4 5 6; do
              echo "Downloading Gradle (attempt $attempt): $url"
              if curl --fail --location --show-error --silent \
                --connect-timeout 30 --max-time 600 \
                --retry 3 --retry-all-errors --retry-delay 8 \
                "$url" -o gradle-8.11.1-bin.zip; then
                if unzip -tq gradle-8.11.1-bin.zip >/dev/null 2>&1; then
                  return 0
                fi
                rm -f gradle-8.11.1-bin.zip
              fi
              sleep 10
            done
            return 1
          }
          download_gradle "https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip" ||
            download_gradle "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
          unzip -q gradle-8.11.1-bin.zip
          echo "$RUNNER_TEMP/gradle-dist/gradle-8.11.1/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-dist/gradle-8.11.1/bin/gradle" --version

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PATH: release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p android clean bundleRelease assembleRelease

      - name: Verify AAB signature
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB"
          keytool -printcert -jarfile "$AAB"

      - name: Sign APK if needed and verify installable package
        env:
          ANDROID_KEYSTORE_PATH: android/app/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "apksigner was not found in Android SDK build-tools"; exit 1; }
          if ! "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            echo "Gradle produced an unsigned APK; signing it with the configured upload key."
            UNSIGNED_APK="${APK%.apk}-unsigned.apk"
            SIGNED_APK="${APK%.apk}-signed.apk"
            cp "$APK" "$UNSIGNED_APK"
            "$APKSIGNER" sign \
              --ks "$ANDROID_KEYSTORE_PATH" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$SIGNED_APK" "$UNSIGNED_APK"
            mv "$SIGNED_APK" "$APK"
            rm -f "$UNSIGNED_APK"
          fi
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: delta-south-evangelism-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-south-evangelism-installable-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
