name: Build Delta South Evangelism Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - native-android-integrated
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
      - "app.py"
      - "templates/**"
      - "static/**"
      - "data/**"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: delta-south-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and package Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - name: Verify backend Python syntax
        run: python -m py_compile ../app.py

      - name: Verify toolchain and install Android signing tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          java -version
          gradle --version
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version

      - name: Prepare release signing key when configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
          fi

      - name: Build installable debug APK and release Android App Bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug bundleRelease

      - name: Verify APK and AAB packages
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -t app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/bundle/release/app-release.aab > app/build/outputs/SHA256SUMS.txt

      - name: Remove temporary signing key
        if: always()
        run: rm -f app/release-key.jks

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Delta-South-Evangelism-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB (unsigned until release signing is configured)
        uses: actions/upload-artifact@v4
        with:
          name: Delta-South-Evangelism-Android-release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload package checksums
        uses: actions/upload-artifact@v4
        with:
          name: Delta-South-Evangelism-Android-checksums
          path: android/app/build/outputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
