name: Build Delta South Android App

on:
  workflow_dispatch:
  push:
    branches:
      - android-standalone-completion

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'
      - name: Build installable debug APK and test AAB
        run: gradle --no-daemon assembleDebug bundleDebug
      - name: Upload Android build outputs
        uses: actions/upload-artifact@v4
        with:
          name: Delta-South-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
